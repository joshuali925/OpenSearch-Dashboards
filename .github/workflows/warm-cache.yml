name: Warm CI caches

# Populate the osd-optimizer (rspack) persistent build cache on the base
# branches so every PR run can restore it before building plugin bundles.
#
# GitHub Actions only lets a run read caches created on its own ref or on the
# repo default/base branch, so a cache saved by one PR is invisible to every
# other PR. Building plugin bundles from scratch costs several minutes and
# happens in every PR (build_and_test and cypress each do a cold build).
# Warming the rspack cache on push to the base branches (plus a nightly
# refresh) gives all PR runs a warm starting point; rspack's persistent cache
# then invalidates per-file for anything the PR actually changed.

on:
  push:
    branches: ['main', '[0-9]+\.x', '[0-9]+\.[0-9]+']
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.lycheeignore'
      - 'CODEOWNERS'
  schedule:
    # Refresh nightly so the cache survives quiet periods: GitHub evicts a
    # cache after 7 days without a read.
    - cron: '0 6 * * *'
  workflow_dispatch:

env:
  OSD_SNAPSHOT_SKIP_VERIFY_CHECKSUM: true
  NODE_OPTIONS: '--max-old-space-size=8192 --max-semi-space-size=64 --dns-result-order=ipv4first'

jobs:
  warm-rspack-cache:
    name: Warm rspack optimizer cache
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          filter: blob:none

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Yarn
        run: |
          npm uninstall -g yarn
          npm i -g yarn@1.22.10
          yarn config set network-timeout 1000000 -g

      - name: Configure Yarn Cache
        run: echo "YARN_CACHE_LOCATION=$(yarn cache dir)" >> $GITHUB_ENV

      - name: Restore Yarn Cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.YARN_CACHE_LOCATION }}
          key: yarn-Linux-${{ hashFiles('**/yarn.lock') }}
          restore-keys: yarn-Linux-

      - name: Run bootstrap
        shell: bash
        run: |
          for i in 1 2 3; do
            yarn osd bootstrap && exit 0
            echo "Bootstrap attempt $i failed, retrying in 10s..."
            sleep 10
          done
          exit 1

      # Restore the newest existing rspack cache so this warm build is itself
      # incremental instead of cold. A miss on the exact key falls back to the
      # newest base-branch cache via the prefix; the very first run is cold.
      - name: Restore rspack cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: '**/node_modules/.cache/rspack'
          key: rspack-cache-Linux-${{ github.sha }}
          restore-keys: rspack-cache-Linux-

      - name: Build plugins
        run: node scripts/build_opensearch_dashboards_platform_plugins --no-examples --workers 10

      - name: Report rspack cache size
        run: |
          du -ch $(find . -type d -path '*/node_modules/.cache/rspack') 2>/dev/null | tail -1 || true

      - name: Save rspack cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: '**/node_modules/.cache/rspack'
          key: rspack-cache-Linux-${{ github.sha }}
